services:
  mycelium-hub-dev:
    build:
      context: /opt/mycelium-hub
      dockerfile: Dockerfile.dev
    container_name: mycelium-hub-dev-core
    ports:
      - '8001:8000'
    env_file:
      - .env.dev
    volumes:
      - mycelium-hub-state:/app/state
      - mycelium-hub-state2:/app/mycelium/state
      - ./mycelium/logs:/app/mycelium/logs
      - ./mycelium/memory:/app/mycelium/memory
    depends_on:
      - mock-ollama
      - dashboard-ui
    networks:
      - mycelium-hub-dev

  mock-ollama:
    build:
      context: ./mock-ollama
      dockerfile: Dockerfile
    container_name: mycelium-hub-dev-mock-ollama
    ports:
      - '11435:11434'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:11434/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - mycelium-hub-dev

  dashboard-ui:
    image: nginx:alpine
    container_name: mycelium-hub-dev-ui
    ports:
      - '8084:80'
      - '8443:443'
    volumes:
      - /opt/mycelium-hub/mycelium-hub/dashboard:/usr/share/nginx/html:ro
      - /opt/mycelium-hub/mycelium-hub-dev/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/mycelium-hub/mycelium-hub-dev/ssl:/etc/nginx/ssl:ro
    networks:
      - mycelium-hub-dev
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  mycelium-hub-dev:
    driver: bridge

volumes:
  mycelium-hub-state:
  mycelium-hub-state2:
